<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAM System · Secure Access</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
    --bg-base: #030712;
    --bg-surface: rgba(17, 24, 39, 0.6);
    --bg-card: rgba(31, 41, 55, 0.3);
    --border-color: rgba(75, 85, 99, 0.4);
    --border-hover: rgba(56, 189, 248, 0.5);
    
    --accent-primary: #38bdf8;
    --accent-secondary: #818cf8;
    --accent-glow: rgba(56, 189, 248, 0.4);
    
    --text-primary: #f9fafb;
    --text-secondary: #9ca3af;
    --text-muted: #6b7280;
    
    --success: #10b981;
    --error: #ef4444;
    
    --font-sans: 'Outfit', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body, html {
    height: 100%;
    font-family: var(--font-sans);
    background-color: var(--bg-base);
    color: var(--text-primary);
    overflow: hidden;
}

/* Dynamic Animated Background */
.bg-wrapper {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
}

.orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.4;
    animation: float 20s infinite ease-in-out alternate;
}

.orb-1 {
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, var(--accent-secondary), transparent);
    top: -10%;
    left: -10%;
}

.orb-2 {
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, var(--accent-primary), transparent);
    bottom: -20%;
    right: -10%;
    animation-delay: -5s;
}

.orb-3 {
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, #c084fc, transparent);
    top: 40%;
    left: 40%;
    animation-duration: 25s;
}

@keyframes float {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(50px, 30px) scale(1.1); }
    100% { transform: translate(-30px, 80px) scale(0.9); }
}

.grid-overlay {
    position: absolute;
    inset: 0;
    background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 30px 30px;
    z-index: 1;
}

/* Layout */
.container {
    position: relative;
    z-index: 10;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
}

/* Glassmorphism Card */
.auth-card {
    background: var(--bg-card);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border-color);
    border-radius: 24px;
    width: 100%;
    max-width: 440px;
    padding: 3rem;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    transform: translateY(0);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.auth-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 0 20px rgba(56, 189, 248, 0.1);
}

/* Header */
.card-header {
    text-align: center;
    margin-bottom: 2.5rem;
}

.sys-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border-radius: 20px;
    background: rgba(16, 185, 129, 0.1);
    border: 1px solid rgba(16, 185, 129, 0.2);
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--success);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 1.5rem;
}

.sys-badge::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 8px var(--success);
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.2); }
}

.card-title {
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(to right, #fff, #9ca3af);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 0.5rem;
}

.card-subtitle {
    font-size: 14px;
    color: var(--text-secondary);
}

/* Forms */
.form-group {
    margin-bottom: 1.5rem;
}

.form-label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.input-wrapper {
    position: relative;
    border-radius: 12px;
    background: rgba(17, 24, 39, 0.5);
    border: 1px solid var(--border-color);
    transition: all 0.3s ease;
    overflow: hidden;
}

.input-wrapper:focus-within {
    border-color: var(--accent-primary);
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1), inset 0 0 10px rgba(56, 189, 248, 0.05);
}

.input-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    transition: color 0.3s ease;
}

.input-wrapper:focus-within .input-icon {
    color: var(--accent-primary);
}

.form-input {
    width: 100%;
    background: transparent;
    border: none;
    padding: 14px 16px 14px 48px;
    font-family: var(--font-sans);
    font-size: 15px;
    color: var(--text-primary);
    outline: none;
}

.form-input::placeholder {
    color: var(--text-muted);
}

/* Button */
.btn-submit {
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
    color: #fff;
    font-family: var(--font-sans);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
    margin-top: 1rem;
}

.btn-submit::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(rgba(255,255,255,0.2), transparent);
    opacity: 0;
    transition: opacity 0.3s ease;
}

.btn-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(56, 189, 248, 0.4);
}

.btn-submit:hover::after {
    opacity: 1;
}

.btn-submit:active {
    transform: translateY(0);
}

.btn-submit.loading {
    color: transparent;
    pointer-events: none;
}

.btn-submit.loading::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 50%;
    width: 20px;
    height: 20px;
    margin: -10px 0 0 -10px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* Messages */
.alert {
    margin-top: 1rem;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    display: none;
    animation: slideUp 0.3s ease;
}

@keyframes slideUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.alert-error {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.2);
    color: #fca5a5;
}

/* Demo Section */
.divider {
    display: flex;
    align-items: center;
    text-align: center;
    margin: 2rem 0;
}

.divider::before, .divider::after {
    content: '';
    flex: 1;
    border-bottom: 1px solid var(--border-color);
}

.divider span {
    padding: 0 10px;
    color: var(--text-muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.demo-creds {
    display: flex;
    gap: 10px;
}

.demo-btn {
    flex: 1;
    background: rgba(31, 41, 55, 0.5);
    border: 1px solid var(--border-color);
    padding: 12px 0;
    border-radius: 8px;
    color: var(--text-secondary);
    font-family: var(--font-sans);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s ease;
}

.demo-btn span {
    display: block;
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 4px;
}

.demo-btn:hover {
    background: rgba(56, 189, 248, 0.1);
    border-color: rgba(56, 189, 248, 0.3);
    color: var(--accent-primary);
}

/* Terminal Line */
.terminal {
    margin-top: 2rem;
    padding: 16px;
    background: rgba(0,0,0,0.3);
    border-radius: 8px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-muted);
    border: 1px solid rgba(255,255,255,0.05);
}

.terminal span.prompt { color: var(--accent-primary); margin-right: 8px; }
.terminal span.cursor {
    display: inline-block;
    width: 6px;
    height: 14px;
    background: var(--text-secondary);
    vertical-align: middle;
    margin-left: 4px;
    animation: blink 1s step-end infinite;
}

</style>
</head>
<body>

<div class="bg-wrapper">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-overlay"></div>
</div>

<div class="container">
    <div class="auth-card">
        <div class="card-header">
            <div class="sys-badge">System Secure</div>
            <h1 class="card-title">DAM Portal</h1>
            <p class="card-subtitle">Authenticate to access monitoring tools</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label">Username</label>
                <div class="input-wrapper">
                    <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    <input type="text" class="form-input" id="username" placeholder="Enter username" autocomplete="off" required>
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="input-wrapper">
                    <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    <input type="password" class="form-input" id="password" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="loginBtn">Authenticate</button>
            <div class="alert alert-error" id="msg"></div>
        </form>

        <div class="divider"><span>Demo Access</span></div>
        
        <div class="demo-creds">
            <button type="button" class="demo-btn" onclick="fillCreds('admin','admin123')">
                Admin <span>Full Access</span>
            </button>
            <button type="button" class="demo-btn" onclick="fillCreds('user1','user123')">
                User <span>Standard</span>
            </button>
            <button type="button" class="demo-btn" onclick="fillCreds('guest1','guest123')">
                Guest <span>Read-Only</span>
            </button>
        </div>

        <div class="terminal">
            <span class="prompt">root@dam:~#</span><span id="termText">waiting for input</span><span class="cursor"></span>
        </div>
    </div>
</div>

<script>
function fillCreds(u, p) {
    document.getElementById('username').value = u;
    document.getElementById('password').value = p;
    document.getElementById('termText').textContent = `loaded payload for user: ${u}`;
}

document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const msg = document.getElementById('msg');
    const term = document.getElementById('termText');
    
    btn.classList.add('loading');
    msg.style.display = 'none';
    term.textContent = 'authenticating...';

    try {
        const r = await fetch('/api/login', {
            method: 'POST', 
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            })
        });
        
        const d = await r.json();
        
        if (d.success) {
            term.textContent = 'access granted. establishing session...';
            btn.classList.remove('loading');
            btn.textContent = 'Access Granted ✓';
            btn.style.background = 'linear-gradient(135deg, var(--success), #059669)';
            setTimeout(() => window.location.href = d.redirect, 800);
        } else if (d.locked) {
            msg.textContent = 'Account locked due to multiple failed attempts.';
            msg.style.display = 'block';
            term.textContent = 'access denied. account locked.';
            btn.classList.remove('loading');
        } else {
            msg.textContent = 'Invalid credentials. Access denied.';
            msg.style.display = 'block';
            term.textContent = 'authentication failed.';
            btn.classList.remove('loading');
            document.getElementById('password').value = '';
        }
    } catch (err) {
        msg.textContent = 'Connection error. Please try again.';
        msg.style.display = 'block';
        btn.classList.remove('loading');
        term.textContent = 'ERR: connection refused.';
    }
});
</script>
</body>
</html>
